name: SMC ML CI

on:
  push:
    branches:
      - "feat/smc-ml-*"
  pull_request:
    paths:
      - "src/strategies/smc-ml/**"
      - "src/types.ts"
      - "src/config.ts"
      - "tests/smc-ml.test.ts"
      - "tests/smc-ml-lifecycle.test.ts"
      - "tests/smc-ml-lifecycle-coordinator.test.ts"
      - "package.json"
      - ".github/workflows/smc-ml.yml"

jobs:
  smc-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The root package currently has a machine-local CoinDCX dependency.
      # Install only the public dependencies needed by this strategy test slice.
      - name: Install SMC test dependencies
        run: >
          npm install --no-save --ignore-scripts
          tsx@4.19.0
          typescript@5.6.0
          zod@3.23.0
          dotenv@16.4.5
          ollama@0.5.0
          @nemesis-oss/binance-sdk@3.0.0

      - name: Typecheck SMC ML slice
        run: >
          npx tsc --noEmit
          --target ES2022
          --module NodeNext
          --moduleResolution NodeNext
          --strict
          --skipLibCheck
          src/types.ts
          src/config.ts
          src/strategies/smc-ml/types.ts
          src/strategies/smc-ml/math.ts
          src/strategies/smc-ml/SmcMlEngine.ts
          src/strategies/smc-ml/SmcConfluence.ts
          src/strategies/smc-ml/SmcExecutionAdvisor.ts
          src/strategies/smc-ml/SmcMlRuntime.ts
          src/strategies/smc-ml/SmcMlRunner.ts
          src/strategies/smc-ml/SmcTradeLifecycle.ts
          src/strategies/smc-ml/SmcTradeLifecycleCoordinator.ts
          src/strategies/smc-ml/SmcBinanceLifecycleExchange.ts
          src/strategies/smc-ml/index.ts

      - name: Run SMC ML tests
        run: npx tsx --test tests/smc-ml.test.ts tests/smc-ml-lifecycle.test.ts tests/smc-ml-lifecycle-coordinator.test.ts
